<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
</head>

<style>
  body {

    background-image: linear-gradient(rgb(105, 72, 167), rgb(152, 117, 216) );
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #todo {

    width: 80%;
    height: 75%;
    display: flex;
    border-radius: 20px;
    box-shadow: 0px 0px 50px rgba(225, 209, 255, 0.5);
  }

  #part1 {
     background-image: linear-gradient(rgb(105, 72, 167), rgb(142, 93, 231) );
    height: 100%;
    width: 63%;
    border-top-left-radius: 20px;
    border-end-start-radius: 20px;

  }

  #part1 h1,
  #part1 p {
    color: white;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    margin-top: 0%;
    transform: translate(70px, 190px);
  }

  #part2 {
    background-color: white;
    height: 100%;
    width: 37%;
    border-top-right-radius: 20px;
    border-end-end-radius: 20px;
  }

  #part2 h1,
  #part2 p,
  #part2 input {
    color: rgb(71, 71, 71);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    margin-top: 0%;
  }

  #part2 h1{
    margin-top: 85px;
    margin-left: 60px;
  }
  input {
    width: 265px;
    height: 40px;
    border-radius: 20px;
    margin-left: 60px;
    
  }

  button {
    width: 265px;
    height: 40px;
    border-radius: 20px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 17px;
    color: white;
    margin-left: 60px;

  }

  label{
    font-size: 15px;
    color: rgb(71, 71, 71);
    

  }
</style>

<body>
  <div id="todo">
    <div id="part1">
      <h1>Welcome back!</h1>
      <p>You can sign in to access with your existing account.</p>

    </div>
    <div id="part2">
      <h1>Sign In</h1>
      
      <input type="text" id="username" name="username" placeholder=" 👤 Username or email"><br><br>
      <input type="password" id="senha" name="senha" placeholder=" 🔐 Password"> <br>
      <label>
        <input style="width: 12px; vertical-align: middle;" type="checkbox" id="remenberMe" name="remenberMe"
          value="remenberMe">
        Remember me
      </label>
      <label style="padding-left: 50px;"> Forgot password?</label>
      <br><br>
      <button type="button" style="background-image: radial-gradient(rgb(152, 117, 216) 18%, rgb(105, 72, 167) 82%);">Sign In</button>
      <br><br><br>
      <label style="margin-left: 108px;">New here? </label>
      <label style="color: rgb(152, 117, 216);"> Create an Account</label>
    </div>
  </div>
</body>
</html>
